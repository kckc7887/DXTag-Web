<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DXTag — 读懂一张谱</title>
    <meta
      name="description"
      content="本地解析 Simai 谱面，用五维评分、计算归因与难点窗口，读懂谱面的负担结构。"
    />
    <meta name="theme-color" content="#f5f6f8" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <a class="skip-link" href="#input-panel">跳到谱面输入</a>
    <header class="masthead">
      <a href="./" class="brand" aria-label="DXTag 首页"
        ><svg viewBox="0 0 32 32" aria-hidden="true">
          <path d="M16 3 29 12 24 28H8L3 12Z" />
          <path d="m16 9 8 6-3 8H11l-3-8Z" /></svg
        >DXTag<span>谱面分析器</span></a
      >
      <nav aria-label="项目链接">
        <a
          href="https://github.com/kckc7887/DXTag/blob/main/docs/ALGORITHM.md"
          target="_blank"
          rel="noreferrer"
          >算法文档</a
        ><a
          href="https://github.com/kckc7887/DXTag-Web"
          target="_blank"
          rel="noreferrer"
          >GitHub</a
        >
      </nav>
    </header>
    <main>
      <section
        class="input-panel"
        id="input-panel"
        aria-labelledby="input-title"
      >
        <div class="input-intro">
          <div>
            <p class="eyebrow">SIMAI / CHART LAB</p>
            <h1 id="input-title">读懂一张谱<span>。</span></h1>
          </div>
          <p>五种负担，一张轮廓。<br />从评分，找到值得练习的片段。</p>
        </div>
        <div class="input-dock">
          <button
            class="import-button"
            id="drop-zone"
            type="button"
            aria-label="选择或拖入 maidata.txt 文件"
          >
            <span aria-hidden="true">＋</span
            ><span>导入谱面<small>选择或拖入 maidata.txt</small></span></button
          ><input
            type="file"
            id="file-input"
            accept=".txt,text/plain"
            hidden
          /><button
            type="button"
            class="paste-button"
            id="paste-toggle"
            aria-expanded="false"
            aria-controls="paste-wrap"
          >
            粘贴文本
          </button>
          <div class="sample-controls">
            <span class="sample-label">合成示例</span>
            <div id="sample-list" class="sample-list"></div>
          </div>
          <span class="privacy"><i></i> 本地计算 · 文件不上传</span>
        </div>
        <div class="paste-wrap" id="paste-wrap" hidden>
          <label for="paste-area"
            >maidata 谱面文本 <span>UTF-8 / UTF-16 文件均可导入</span></label
          ><textarea
            id="paste-area"
            spellcheck="false"
            placeholder="&title=谱面名称&#10;&inote_5=(150){16}1,2,3,4,..."
          ></textarea>
          <div class="paste-actions">
            <button type="button" class="primary-button" id="paste-run">
              分析文本</button
            ><button type="button" id="paste-clear">清空</button>
          </div>
        </div>
        <p class="status" id="status" role="status" aria-live="polite"></p>
        <div id="errors" role="alert"></div>
      </section>
      <section
        id="results"
        class="results"
        aria-label="谱面分析结果"
        hidden
      ></section>
      <div id="empty-state" class="empty-state" hidden>
        <span class="empty-mark" aria-hidden="true">DX</span>
        <h2>下一张，轮到你的谱面。</h2>
        <p>导入 maidata.txt，或从上方选择一张合成示例。</p>
      </div>
      <aside class="reading-note">
        <b>如何读这些分数</b>
        <p>
          0.0–10.0
          表示算法估计的五维工作量，不是官方定数，也不是通关难度。与玩家实际表现的对应关系尚未验证，不包含判定或最优手序求解；请结合实际游玩体验阅读。
        </p>
      </aside>
    </main>
    <footer>
      <span class="footer-brand">DXTag <span>把谱面展开来看。</span></span>
      <div>
        <a
          href="https://github.com/kckc7887/DXTag"
          target="_blank"
          rel="noreferrer"
          >评分引擎</a
        ><span id="footer-versions"></span><span>MIT · © 2026 尘言</span>
      </div>
    </footer>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
