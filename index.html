<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>DXTag · 舞萌DX谱面分析</title>
    <meta name="description" content="轻量、简单、开源。将 maidata.txt 放进 DXTag，在浏览器内探索舞萌 DX 谱面的五维评分、计算依据和高负担片段。" />
    <meta name="theme-color" content="#f3fcff" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="./fonts/dxtag-display.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div class="page-confetti"><i></i><i></i><i></i></div>
    <header class="masthead">
      <a href="./" class="brand"><span class="brand-orbit">✦</span><b>DXTag</b><span class="brand-note">CHART ANALYZER</span></a>
      <nav>
        <a href="https://github.com/kckc7887/DXTag/blob/a768e059cb859538b68650efc37bdfd83206211e/docs/ALGORITHM.md" target="_blank" rel="noreferrer">算法文档 <span>↗</span></a>
        <a href="https://github.com/kckc7887/DXTag-Web" target="_blank" rel="noreferrer">GitHub <span>↗</span></a>
      </nav>
    </header>
    <main>
      <section class="input-panel" id="input-panel">
        <div class="opening-stage">
          <div class="title-stage">
            <div class="title-orbit"><i></i><i></i></div>
            <span class="spark spark-one">✦</span><span class="spark spark-two">★</span>
            <p class="hero-kicker">读懂一张谱，从这里开始</p>
            <h1 id="input-title">DXTag</h1>
            <p class="hero-tagline">轻量<span>·</span>简单<span>·</span>开源</p>
            <p class="hero-description">舞萌DX谱面分析</p>
          </div>
          <div class="input-workbench">
            <div class="input-intro"><h2><span>开箱</span><span>即用</span><i>!</i></h2><p>放进谱面，展开你的五维轮廓。<br />分数、依据、片段，一次看清。</p></div>
            <div class="input-dock">
              <button class="import-button" id="drop-zone" type="button">
                <span class="file-glyph"><i>DX</i></span>
                <span><b>放入你的谱面</b><small>点击选择 / 拖入 maidata.txt</small></span>
                <span class="import-arrow">↗</span>
              </button>
              <input type="file" id="file-input" accept=".txt,text/plain" hidden />
              <div class="input-alternatives"><button type="button" class="paste-button" id="paste-toggle">粘贴文本</button><span class="privacy"><i></i>本地计算 · 文件不上传</span></div>
            </div>
          </div>
        </div>
        <div class="paste-wrap" id="paste-wrap" hidden>
          <label for="paste-area">maidata 谱面文本 <span>文件支持 UTF-8 / 带 BOM 的 UTF-16</span></label>
          <textarea id="paste-area" spellcheck="false" placeholder="在这里粘贴完整的 maidata 谱面文本"></textarea>
          <div class="paste-actions"><button type="button" class="primary-button" id="paste-run">分析文本 ↗</button><button type="button" id="paste-clear">清空</button></div>
        </div>
        <p class="status" id="status"></p>
        <div id="errors"></div>
      </section>
      <section id="results" class="results" hidden></section>
      <div id="empty-state" class="empty-state"><span class="empty-mark">✦</span><h2>放入谱面，查看五维轮廓。</h2><p>导入 maidata.txt，或粘贴完整的谱面文本。</p></div>
    </main>
    <footer><a class="footer-brand" href="#input-panel">DXTag <span>轻量 · 简单 · 开源</span></a><div><a href="https://github.com/kckc7887/DXTag" target="_blank" rel="noreferrer">评分引擎 ↗</a><span id="footer-versions"></span><span>MIT · © 2026 尘言</span></div></footer>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
